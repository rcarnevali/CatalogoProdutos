<div class="secao-produtos-header">
  <h2 class="titulo-secao">{{ categoriaNomeExibicao }}</h2>
  <span class="contador-itens" *ngIf="!carregandoProdutos">({{ sugestoes.length }} produtos)</span>
</div>

<div *ngIf="carregandoProdutos" class="status-carregamento">
  <p>Carregando produtos...</p>
</div>

<div class="grade-produtos" *ngIf="!carregandoProdutos && sugestoes.length > 0">
  <div class="produtos" *ngFor="let produto of sugestoes">
    <button
      type="button"
      class="botao-interesse"
      [class.interessado]="listaService.temInteresse(produto.id)"
      (click)="listaService.alternarInteresse(produto.id)"
      [attr.aria-label]="listaService.temInteresse(produto.id) ? 'Remover interesse' : 'Tenho interesse'"
      [title]="listaService.temInteresse(produto.id) ? 'Remover interesse' : 'Tenho interesse'"
    >
      ❤
    </button>
    <img [src]="produto.image" [alt]="produto.title" width="100">
    <p class="produto-titulo">{{ produto.title }}</p>
    <p class="produto-preco">R$ {{ produto.price }}</p>
    <a
      *ngIf="listaService.temInteresse(produto.id)"
      href="#"
      class="link-observacao"
      (click)="$event.preventDefault()"
    >
      Adicionar observação
    </a>
  </div>
</div>

<div *ngIf="!carregandoProdutos && sugestoes.length === 0" class="status-vazio">
  <p>Nenhum produto encontrado nesta categoria.</p>
</div>
